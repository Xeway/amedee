{{ define "index.html" }}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amedee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/lib/bootstrap.min.css">
  <script src="/static/lib/htmx.min.js"></script>
  <style>
    /* A simple class to show/hide the htmx spinner */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Amedee</a>
    </div>
  </nav>

  <main class="container mt-5">
    <div class="p-5 bg-white rounded-3 shadow-sm text-center">
      <h1 class="display-4">Welcome to Amedee</h1>
      <p class="lead">Find available Swiss huts on a map.</p>
      <hr class="my-4">

      <div id="auth-container"
        hx-get="/logged_in"
        hx-trigger="load"
        hx-swap="outerHTML">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
      </div>
    </div>
  </main>

  <script src="/static/lib/bootstrap.bundle.min.js"></script>
</body>
</html>
{{ end }}
